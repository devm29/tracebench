[project]
name = "tracebench"
version = "0.1.0"
description = "OpenTelemetry-native LLM observability and regression testing"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "sqlalchemy[asyncio]>=2.1.8",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "clickhouse-connect[async]>=1.12",
  "opentelemetry-proto>=1.45",
  "opentelemetry-sdk>=1.45",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "protobuf>=7.36",
  "googleapis-common-protos>=1.76",
  "httpx>=0.28.1",
  "jsonschema>=4.26",
  "typer>=0.28",
  "rich>=15.0",
  "structlog>=26.1",
  "anthropic>=2.6",
  "numpy>=2.5",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.9"]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "mypy>=2.4",
  "ruff>=0.17",
  "types-jsonschema",
  "types-protobuf",
]

[project.scripts]
tracebench = "tracebench.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebench"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["google.rpc.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires ClickHouse and Postgres"]
