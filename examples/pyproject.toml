[project]
name = "tracebench-examples"
version = "0.1.0"
description = "Instrumented sample LLM apps and a demo traffic seeder for Tracebench"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.6",
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28.1",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "opentelemetry-sdk>=1.45",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_apps"]
