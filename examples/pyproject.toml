[project]
name = "tracebench-examples"
version = "0.1.0"
description = "Instrumented sample LLM apps and a demo traffic seeder for Tracebench"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.75",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_apps"]
